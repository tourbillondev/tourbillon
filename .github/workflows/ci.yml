name: ci
on: [push, pull_request]

# The job token can only read the repository.
permissions:
  contents: read

# Every action is pinned to a full commit SHA (the version is in the comment); Dependabot proposes updates.
jobs:
  contracts:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: contracts } }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { persist-credentials: false, submodules: recursive }
      - uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1.9.2
      - run: forge build --sizes --skip script
      - run: forge test

  services:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults: { run: { working-directory: services } }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { persist-credentials: false, submodules: recursive }
      # anvil and forge: the services' end-to-end tests deploy the contracts on a local chain
      - uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1.9.2
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with: { bun-version-file: services/package.json } # the packageManager pin
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test

  website:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults: { run: { working-directory: website } }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { persist-credentials: false, submodules: recursive }
      # anvil and forge: the generated contract interface is checked against the build, and the live end-to-end test
      # runs the site's own code against the local stack
      - uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1.9.2
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with: { bun-version-file: services/package.json } # the packageManager pin
      - run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile
        working-directory: services
      - run: forge build --skip script
        working-directory: contracts
      - run: node --test tests/*.test.mjs
      - run: bun test test-bun
      - run: bunx vite build
      - run: bunx vite build --outDir dist-live
        env: { VITE_TOURBILLON_MODE: live }

  banned-words:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { persist-credentials: false }
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with: { bun-version-file: services/package.json } # the packageManager pin
      # the one words list on everything that is published (the repo minus publish-exclude.txt)
      - run: bun tools/banned-words.ts .

  # Fails if a pushed commit adds a secret that is live or could not be checked.
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: trufflesecurity/trufflehog@31ce31ee1abbcc7dc8eee5764c17121c3044c8b2 # v3.99.7
        with:
          extra_args: --results=verified,unknown
