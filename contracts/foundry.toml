[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
evm_version = "cancun"
via_ir = true
optimizer = true
optimizer_runs = 200
# Pinned so a build can be compared byte for byte with what is deployed.
bytecode_hash = "ipfs"
cbor_metadata = true
fs_permissions = [{ access = "read-write", path = "./deployments" }, { access = "read", path = "./out" }, { access = "read", path = "./calendar" }]
auto_detect_remappings = false
remappings = [
    "forge-std/=lib/forge-std/src/",
    "@prb/math/=lib/prb-math/",
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "@safe/=lib/safe-smart-account/contracts/",
]

# Safe v1.4.1 (lib/safe-smart-account) does not compile with via-IR (stack too deep in execTransaction); its sources
# compile with the legacy pipeline, same solc, everything else unchanged.
additional_compiler_profiles = [{ name = "safe", via_ir = false, optimizer = true, optimizer_runs = 200 }]
compilation_restrictions = [{ paths = "lib/safe-smart-account/**", via_ir = false }]

[fuzz]
runs = 1000
seed = "0x7462"

# The playbook's depth for stateful invariants (03 §2): 100,000 calls per suite (1,000 runs × 100 calls each). Every
# suite also carries inline deep.* lines (inline default.* lines would otherwise apply under this profile too). Run with
#   FOUNDRY_PROFILE=deep forge test --match-path 'test/invariant/*'
# CI runs it on a schedule (.github/workflows/invariants-deep.yml). The default profile keeps a shorter depth per suite.
[profile.deep.invariant]
runs = 1000
depth = 100

[fmt]
line_length = 120
